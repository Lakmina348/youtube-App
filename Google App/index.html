<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Play | Loading</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #111111; /* ඔබේ ඇප් එකේ තේමාවට ගැළපෙන කළු පසුබිම */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
        }

        /* Google Play වර්ණ සහිත සජීවී වළල්ල */
        .play-loader {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 6px solid transparent;
            border-radius: 50%;
            animation: rotate 2s linear infinite;
        }

        /* Google Play Colors */
        .blue { border-top-color: #4285F4; animation-duration: 1.5s; }
        .red { border-top-color: #EA4335; animation-duration: 2s; transform: rotate(120deg); }
        .yellow { border-top-color: #FBBC05; animation-duration: 2.5s; transform: rotate(240deg); }
        .green { border-top-color: #34A853; animation-duration: 3s; }

        /* මැද ඇති Google Play Icon එක */
        .play-icon {
            position: absolute;
            top: 50%;
            left: 55%; /* මැදට වඩා පොඩ්ඩක් දකුණට (Play triangle හැඩය නිසා) */
            transform: translate(-50%, -50%);
            width: 40px;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
        }

        .loading-text {
            margin-top: 40px;
            color: #9aa0a6;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Animations */
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-out {
            animation: fadeOut 0.6s forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: scale(0.9); }
        }
    </style>
</head>
<body>

    <div class="play-loader" id="loader">
        <div class="circle blue"></div>
        <div class="circle red"></div>
        <div class="circle yellow"></div>
        <div class="circle green"></div>
        <img class="play-icon" src="https://upload.wikimedia.org/wikipedia/commons/d/d0/Google_Play_Arrow_logo.svg" alt="Play Store">
    </div>

    <div class="loading-text">Google Play</div>

    <script>
        // යොමු විය යුතු පිටුව (Location)
        const targetLocation = "App.html";

        // තත්පර 3 කට පසු පිටුව මාරු කිරීම
        setTimeout(() => {
            document.getElementById('loader').parentElement.classList.add('fade-out');
            
            setTimeout(() => {
                window.location.href = targetLocation;
            }, 600);
        }, 3000);
    </script>

</body>
</html>
