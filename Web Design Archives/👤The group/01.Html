<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downloads - LS Web Design</title>
<style>
  :root{
    --bg:#000000;
    --panel:#111214;
    --border:#232323;
    --accent:#00e676;
    --accent2:#ff007f;
    --text:#ffffff;
    --sub:#9a9a9a;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
  body{
    background:radial-gradient(circle at top, #101014, #000000 60%);
    color:var(--text);
    min-height:100vh;
    padding:30px 16px 60px;
  }
  .wrap{max-width:520px;margin:0 auto;}

  .header{text-align:center;margin-bottom:30px;}
  .header .logo{
    font-size:13px;letter-spacing:2px;color:var(--accent);
    text-transform:uppercase;margin-bottom:6px;font-weight:bold;
  }
  .header h1{font-size:24px;margin-bottom:8px;}
  .header p{color:var(--sub);font-size:13.5px;}

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    gap:16px;
    transition:transform .2s ease, border-color .2s ease;
  }
  .card:hover{transform:translateY(-3px);border-color:var(--accent);}

  .thumb{
    width:64px;height:64px;
    border-radius:14px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:28px;
  }
  .thumb.love{background:linear-gradient(135deg,#ff007f,#9333ea);}
  .thumb.game{background:linear-gradient(135deg,#00c6ff,#0072ff);}

  .card-info{flex:1;min-width:0;}
  .card-info h2{font-size:16px;margin-bottom:4px;}
  .card-info p{font-size:12.5px;color:var(--sub);line-height:1.4;}

  .dl-btn{
    background:var(--accent);
    color:#000;
    text-decoration:none;
    font-size:13px;
    font-weight:bold;
    padding:10px 16px;
    border-radius:30px;
    white-space:nowrap;
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:transform .15s ease;
  }
  .dl-btn:active{transform:scale(.95);}

  .footer{
    text-align:center;
    margin-top:34px;
    color:var(--sub);
    font-size:12px;
  }
  .footer span{color:var(--accent2);}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="logo">LS · Web Design</div>
    <h1>Downloads</h1>
    <p>ඔයාට ගැලපෙන file එක තෝරලා Download button එක click කරන්න</p>
  </div>

  <!-- Item 1 -->
  <div class="card">
    <div class="thumb love">💖</div>
    <div class="card-info">
      <h2>Eternal Love Message Web</h2>
      <p>Personalized love message reveal page (HTML)</p>
    </div>
    <a class="dl-btn" href="https://drive.google.com/uc?export=download&id=1cyUsMqcuFfGJsFCEp-0n1NqTrintxzPU" rel="noopener">
      ⬇ Download
    </a>
  </div>

  <!-- Item 2 -->
  <div class="card">
    <div class="thumb game">🎮</div>
    <div class="card-info">
      <h2>The PC (Game)</h2>
      <p>Mini game / interactive HTML page</p>
    </div>
    <a class="dl-btn" href="https://drive.google.com/uc?export=download&id=1v6nN1IDl9FP9b-jjP5fTvhDQ6QlQtvMH" rel="noopener">
      ⬇ Download
    </a>
  </div>

  <div class="footer">
    Made with <span>♥</span> by LS Web Design
  </div>

</div>
</body>
</html>
